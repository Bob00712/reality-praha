name: scrape
on:
  schedule:
    - cron: "7,37 * * * *"   # každých 30 min (UTC)
  workflow_dispatch:          # ruční spuštění z GitHubu
permissions:
  contents: write
concurrency: scrape
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scraper.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Ulozit data
        run: |
          git config user.name "scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet && exit 0
          git commit -m "data $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            echo "push odmítnut, slučuji s novější verzí (pokus $i)"
            cp docs/data.json /tmp/ours.json
            rm -rf /tmp/probe && cp -r docs/probe /tmp/probe 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python scraper.py --merge /tmp/ours.json
            mkdir -p docs/probe && cp -rn /tmp/probe/. docs/probe/ 2>/dev/null || true
            git add docs/
            git commit -m "data merge $(date -u +%FT%TZ)" || true
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
