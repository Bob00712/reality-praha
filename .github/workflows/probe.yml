name: probe-sources
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Jen tyto domény (mezerou oddělené), prázdné = všechny"
        required: false
        default: ""
permissions:
  contents: write
concurrency: probe
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/probe_sources.py ${{ github.event.inputs.only }}
      - name: Ulozit vystup
        run: |
          git config user.name "scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/probe/sources
          git diff --staged --quiet && exit 0
          git commit -m "probe zdroje $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
