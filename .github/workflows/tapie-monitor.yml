name: tapie-monitor
on:
  schedule:
    - cron: "23 4 * * *"   # denně 4:23 UTC = 5:23 v zimě / 6:23 v létě (čas ČR)
  workflow_dispatch:         # ruční spuštění: Actions -> tapie-monitor -> Run workflow
    inputs:
      mode:
        description: "normal / test (zkušební zpráva) / weekly (souhrn hned) / chats (zjistit chat ID)"
        default: normal
permissions:
  contents: write
concurrency: tapie-monitor
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tapie-monitor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Spustit monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TAPIE_TELEGRAM_TOKEN: ${{ secrets.TAPIE_TELEGRAM_TOKEN }}
          TAPIE_TELEGRAM_CHAT_ID: ${{ secrets.TAPIE_TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode || 'normal' }}
        run: |
          case "$MODE" in
            test)   python monitor.py --test ;;
            weekly) python monitor.py --weekly ;;
            chats)  python monitor.py --chats ;;
            *)      python monitor.py ;;
          esac
      - name: Ulozit stav (aby nechodily duplicity)
        if: always()
        run: |
          git config user.name "tapie-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "tapie stav $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            echo "push odmítnut, přebírám novější main (pokus $i)"
            git pull --rebase origin main || exit 1
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
